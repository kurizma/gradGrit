<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GradGrit Message Board</title>
  </head>

  <body>
    <main>
      <h1>Messages</h1>

      <section aria-labelledby="messages-heading">
        <h2 id="messages-heading">Approved messages</h2>
        <div id="messages" aria-live="polite">
          Loading messages...
        </div>
      </section>

      <section aria-labelledby="new-message-heading">
        <h2 id="new-message-heading">New message</h2>

        <form id="message-form">
          <div>
            <label for="name">Your name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              maxlength="50"
              autocomplete="name"
              placeholder="Capybara"
            />
          </div>

          <div>
            <label for="message">Your message</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              required
              maxlength="500"
              placeholder="Write your birthday message here"
            ></textarea>
          </div>

          <div>
            <label for="access_code">Access code</label>

            <div>
              <input
                id="access_code"
                name="access_code"
                type="password"
                required
                autocomplete="off"
                placeholder="Enter the access code"
              />

              <button
                type="button"
                id="toggle-access-code"
                aria-controls="access_code"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <div>
            <label for="file">Upload a file</label>
            <input
              id="file"
              name="file"
              type="file"
              accept="image/*,audio/*,video/*"
            />

            <small>
              Optional. Images up to 10 MB, audio up to 15 MB, and video up to
              25 MB.
            </small>
          </div>

          <button type="submit" id="submit-button">
            Send message
          </button>

          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
